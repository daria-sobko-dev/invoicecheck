# PostgreSQL database for InvoiceCheck.
# Start: docker compose up -d   Stop: docker compose down
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: invoicecheck
      POSTGRES_PASSWORD: invoicecheck
      POSTGRES_DB: invoicecheck
    ports:
      - "5432:5432" # host port : port inside the container
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives container restarts

  # Redis stores the job queue for BullMQ.
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
